name: Tokutei job agent

on:
  schedule:
    - cron: "0 23 * * *"   # 23:00 UTC = 08:00 JST (JST = UTC+9, tanpa DST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (jangan tulis ke Notion)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run agent
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m agent.main ${{ inputs.dry_run && '--dry-run' || '' }}
